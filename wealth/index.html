<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="按每月开支、收益率与通胀，加上育儿、健康、房子等大额支出，估算财富自由需要的资产；也可以按工资与初始资产推演这笔钱够花多久，或反过来定下花完的年份，求某项开支、月均工资该是多少。数据只在本地计算。"
    />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <title>财富自由计算器</title>
    <link rel="stylesheet" href="./src/styles/base.css" />
    <link rel="stylesheet" href="./src/styles/controls.css" />
    <link rel="stylesheet" href="./src/styles/app.css" />
    <link rel="stylesheet" href="./src/styles/result.css" />
    <script>
      try {
        const saved = localStorage.getItem("wealth-theme");
        document.documentElement.dataset.theme =
          saved === "dark" || (saved !== "light" && matchMedia("(prefers-color-scheme: dark)").matches)
            ? "dark"
            : "light";
      } catch {
        document.documentElement.dataset.theme = matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light";
      }
    </script>
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9.2" />
            <path d="M7.4 15.6l3.1-3.1 2.4 2.2 3.7-4.3" />
            <path d="M13.6 10.4h3.2v3.2" />
          </svg>
        </div>
        <div class="brand-copy">
          <p class="eyebrow">FINANCIAL INDEPENDENCE</p>
          <h1>财富自由计算器</h1>
        </div>
        <div class="theme-switch" role="radiogroup" aria-label="主题">
          <label>
            <input type="radio" name="theme" value="system" aria-label="跟随系统" checked />
            <span aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="12" rx="2" />
                <path d="M8.5 20h7M12 16v4" />
              </svg>
            </span>
          </label>
          <label>
            <input type="radio" name="theme" value="light" aria-label="浅色主题" />
            <span aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <circle cx="12" cy="12" r="4" />
                <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
              </svg>
            </span>
          </label>
          <label>
            <input type="radio" name="theme" value="dark" aria-label="深色主题" />
            <span aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
              </svg>
            </span>
          </label>
        </div>
      </header>

      <nav class="mode-switch" aria-label="计算方式">
        <label>
          <input type="radio" name="mode" value="need" checked />
          <span>算需要多少</span>
        </label>
        <label>
          <input type="radio" name="mode" value="reverse" />
          <span>按目标反推</span>
        </label>
      </nav>

      <div class="calc-stack">
        <form class="panel form-panel" id="form" autocomplete="off" novalidate>
          <section class="form-section">
            <div class="section-heading">
              <h2>起点与收入</h2>
              <p>从初始资产开始，工资逐月进来、生活费逐月扣掉，看这笔钱能撑多久。</p>
            </div>
            <div class="field-row">
              <label class="field">
                <span class="field-label">初始资产<em>万元</em></span>
                <input type="number" data-field="initialAssets" min="0" step="1" inputmode="decimal" />
              </label>
              <label class="field" data-group="salary">
                <span class="field-label">月均工资<em>万元 / 月</em></span>
                <input type="number" data-field="salary" min="0" step="0.1" inputmode="decimal" />
              </label>
            </div>
            <div class="field-row">
              <label class="field">
                <span class="field-label">工资年增长率<em>%</em></span>
                <input type="number" data-field="salaryGrowth" min="0" step="0.5" inputmode="decimal" />
              </label>
              <label class="field" data-group="workYears">
                <span class="field-label">工作时长<em>年</em></span>
                <input type="number" data-field="workYears" min="0" step="1" inputmode="numeric" />
              </label>
            </div>
          </section>

          <section class="form-section" data-when="reverse" hidden>
            <div class="section-heading">
              <h2>反推目标</h2>
              <p>想让它刚好在第几年花完，再勾出要反推的项。</p>
            </div>
            <label class="field">
              <span class="field-label">希望第几年花完<em>年</em></span>
              <input type="number" data-field="targetYears" min="1" max="100" step="1" inputmode="numeric" />
            </label>
            <fieldset>
              <legend class="field-label">想反推的部分</legend>
              <ul class="targets">
                <li><label class="target"><input type="checkbox" data-target value="living" /><span>日常生活</span></label></li>
                <li><label class="target"><input type="checkbox" data-target value="children" /><span>育儿</span></label></li>
                <li><label class="target"><input type="checkbox" data-target value="health" /><span>健康</span></label></li>
                <li><label class="target"><input type="checkbox" data-target value="major" /><span>重大投入</span></label></li>
                <li><label class="target"><input type="checkbox" data-target value="salary" /><span>月均工资</span></label></li>
                <li><label class="target"><input type="checkbox" data-target value="workYears" /><span>工作时长</span></label></li>
              </ul>
              <p class="field-hint">勾中的项各自单独反推：只改这一项、其余按当前输入，正好在第 N 年花完需要多少；没勾的按上面填的数字锁定。</p>
            </fieldset>
          </section>

          <section class="form-section">
            <div class="section-heading">
              <h2>生活开支</h2>
              <p>先定下每月花多少，再说这笔钱要多大才能一直覆盖它。</p>
            </div>
            <fieldset>
              <legend class="field-label">一个人住，还是两个人</legend>
              <div class="segmented">
                <label><input type="radio" name="identity" value="single" checked /><span>单人</span></label>
                <label><input type="radio" name="identity" value="couple" /><span>夫妻</span></label>
              </div>
            </fieldset>
            <label class="field" data-group="living">
              <span class="field-label">人均月消费<em>万元 / 月</em></span>
              <input type="number" data-field="monthlyPerPerson" min="0" step="0.1" inputmode="decimal" />
              <small id="spend-hint"></small>
            </label>
            <div class="field-row">
              <label class="field">
                <span class="field-label">年收益率<em>%</em></span>
                <input type="number" data-field="rate" min="0" step="0.1" inputmode="decimal" />
              </label>
              <label class="field">
                <span class="field-label">通货膨胀率<em>%</em></span>
                <input type="number" data-field="inflation" min="0" step="0.1" inputmode="decimal" />
              </label>
            </div>
          </section>

          <section class="form-section">
            <div class="section-heading">
              <h2>专项支出</h2>
              <p>一次性或分几年投下去的大额开销。</p>
            </div>
            <div class="field-row">
              <label class="field">
                <span class="field-label">孩子数量<em>个</em></span>
                <input type="number" data-field="children" min="0" step="1" inputmode="numeric" />
              </label>
              <label class="field" data-group="children">
                <span class="field-label">育儿总成本<em>万元 / 孩</em></span>
                <input type="number" data-field="childUnitCost" min="0" step="1" inputmode="decimal" />
              </label>
            </div>
            <div class="field-row">
              <label class="field" data-group="health">
                <span class="field-label">健康开销<em>万元</em></span>
                <input type="number" data-field="health" min="0" step="1" inputmode="decimal" />
              </label>
              <label class="field" data-group="major">
                <span class="field-label">重大投入<em>万元 · 主要是房子</em></span>
                <input type="number" data-field="major" min="0" step="1" inputmode="decimal" />
              </label>
            </div>
          </section>

          <div class="form-actions">
            <button class="button button-quiet" id="reset" type="button">恢复默认值</button>
          </div>
        </form>

        <aside class="panel result-panel">
          <div id="result" class="result-body" aria-live="polite"></div>
        </aside>
      </div>

      <footer class="app-footer">
        <p>这里的财富自由，指以理想的生活开支水平、不工作的方式一直维持到老，资产不缩水、购买力不下降所需要的资产。</p>
      </footer>
    </main>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
