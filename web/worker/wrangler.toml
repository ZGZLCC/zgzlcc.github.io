# Cloudflare Worker + KV 配置。
# 一个同步码对应一个 KV 键，多个用户可以各用各的数据分区。
# id 取自 `npx wrangler kv namespace create TIME_SYNC` 的输出。
# 绑定名固定为 TIME_SYNC，改这里就必须同步改 worker/src/http.ts。
name = "time-sync"
main = "src/index.ts"
compatibility_date = "2026-01-01"

[[kv_namespaces]]
binding = "TIME_SYNC"
id = "5a4cb1eb375c418ea2707c2804be4cba"

# 管理口令用 `npx wrangler secret put ADMIN_TOKEN` 写入，不要写在这里。
# 可选：限定允许访问的前端来源，多个用逗号分隔；留空时默认放行
# https://zgzlcc.github.io 与本地开发地址。
# [vars]
# ALLOWED_ORIGINS = "https://zgzlcc.github.io"
